services:
  db:
    image: postgres:16-alpine
    container_name: hikmat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hikmat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hikmat_pass}
      POSTGRES_DB: ${POSTGRES_DB:-hikmat_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hikmat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hikmat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: hikmat_api
    restart: unless-stopped
    env_file: .env
    environment:
      # appuser cannot mkdir under the bind-mounted /app — use /tmp in containers.
      PRIVATE_UPLOAD_DIR: /tmp/hikmat_private_uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    container_name: hikmat_celery_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
      - redis
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app worker --loglevel=info

  flower:
    build: .
    container_name: hikmat_flower
    restart: unless-stopped
    env_file: .env
    depends_on:
      - celery_worker
    ports:
      - "5555:5555"
    command: celery -A app.workers.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data: